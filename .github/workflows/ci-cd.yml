name: ci-cd pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: build api img
        run: docker compose build
        
      - name: copy files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "."
          target: "/home/root/apps/it-college-backend"
          
      - name: generate appsettings
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/root/apps/it-college-backend
            echo '{
              "Logging": {
                "LogLevel": {
                  "Default": "Information",
                  "Microsoft.AspNetCore": "Warning"
                }
              },
              "AllowedHosts": "*",
              "ConnectionStrings": {
                "DefaultConnection": "${{ secrets.CONNECTION_STRING }}"
              },
              "Jwt": {
                "Issuer": "it-college-backend",
                "Audience": "api-it-college-backend",
                "Key": "${{ secrets.JWT_KEY }}"
              }
            }' > appsettings.json
            
      - name: restart containers
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /home/root/apps/it-college-backend
            docker-compose down
            docker-compose up --build -d