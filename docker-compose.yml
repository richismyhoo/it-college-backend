services:
  api:
    container_name: api-college
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - it-college-network
  
  nginx:
    image: nginx:alpine
    container_name: nginx-college
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - it-college-network

networks:
  it-college-network:
    driver: bridge